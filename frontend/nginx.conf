# Serves the built React app and forwards /api to the backend container, so the site
# and API share one origin (the session cookie needs that).
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # Only ever reached through tailscale serve's HTTPS, so browsers should never try plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # tailscale serve appends the visitor's tailnet IP to X-Forwarded-For and reaches us via
    # Docker's port mapping (172.16/12) or localhost. Trust only those hops, so $remote_addr
    # becomes the visitor and a forged X-Forwarded-For can't pick its own address (ADR 0005).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Always overwritten here; the API keys its sign-in rate limit on it.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Client-side routes (/signin etc.) all load index.html.
    location / {
        try_files $uri /index.html;
    }
}
