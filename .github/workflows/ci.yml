name: CI

on:
  pull_request:
  push:
    branches: [main]
  # PR/push runs only scan the new commits; scheduled and manual runs scan the whole history.
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

# Least privilege: jobs can read the repo (and list a PR's commits) and nothing else.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; a cancelled push-to-main scan would never be re-run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (a tag can be moved; a SHA can't). Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so a secret added and later deleted is still caught
          persist-credentials: false # nothing here pushes, so don't leave the token in .git/config
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # PR comments would need write permission; the job summary is enough

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Throwaway database that only exists for this job; same Postgres version as the homelab.
      postgres:
        image: postgres:17.11-trixie
        env:
          POSTGRES_USER: fitscape_test
          POSTGRES_PASSWORD: ci-only # not a secret: the container is private to this job and deleted after
          POSTGRES_DB: fitscape_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitscape_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fitscape_test:ci-only@localhost:5432/fitscape_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
