name: Feature
description: Propose a new capability or improvement
labels: ["feat"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible after this is done, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's included, and what's explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria we can check off.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Design ideas, links, open questions.
